name: Backend CI
on:
  push:
    branches: [main]
    paths: ['bruno-jesus-portfolio-backend/**']
  pull_request:
    branches: [main]
    paths: ['bruno-jesus-portfolio-backend/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bruno-jesus-portfolio-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: bruno-jesus-portfolio-backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run security:check
      - run: npm audit --audit-level=high
